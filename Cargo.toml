[package]
name = "phobos"
version = "0.1.0"
edition = "2021"
description = "💀 Phobos IDE — The God of Fear. Polyglot. Native. Unstoppable."
license = "AGPL-3.0"

[dependencies]
# GUI Framework
egui = "0.28"
eframe = "0.28"

# Syntax Highlighting
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# File System
rfd = "0.14"
walkdir = "2"

# Terminal
portable-pty = "0.8"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Git
git2 = "0.18"

# Logging
log = "0.4"
env_logger = "0.11"

# Error Handling
anyhow = "1"

# Hex / Low-Level
hex = "0.4"
iced-x86 = "1"

# Process
which = "6"
chrono = "0.4.45"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
